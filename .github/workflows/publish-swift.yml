name: Publish Swift SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.2.0)"
        required: true
        type: string
      dry-run:
        description: "Dry run — build & test only, skip tagging"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: true

jobs:
  build-and-test:
    name: Build + Test
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - package: hypen-renderer-swift
            name: HypenSwift
          - package: hypen-server-swift
            name: HypenServer
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }}
        run: swift build
        working-directory: ${{ matrix.package }}

      - name: Test ${{ matrix.name }}
        run: swift test
        working-directory: ${{ matrix.package }}

  # SPM packages are consumed from mirror repos via git URL + tag.
  # This job syncs each subdirectory to its mirror repo and creates a version tag there.
  #
  # Mirror repos:
  #   - hypen-lang/hypen-swiftui        ← hypen-renderer-swift/
  #   - hypen-lang/hypen-server-swift ← hypen-server-swift/
  #
  # SPM consumers use:
  #   .package(url: "https://github.com/hypen-lang/hypen-swiftui.git", from: "X.Y.Z")
  #   .package(url: "https://github.com/hypen-lang/hypen-server-swift.git", from: "X.Y.Z")
  publish-to-mirrors:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: ${{ !inputs.dry-run }}
    strategy:
      matrix:
        include:
          - prefix: hypen-renderer-swift
            name: HypenSwift
            mirror: hypen-lang/hypen-swiftui
          - prefix: hypen-server-swift
            name: HypenServer
            mirror: hypen-lang/hypen-server-swift
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split, push, and tag ${{ matrix.name }}
        env:
          MIRROR_TOKEN: ${{ secrets.SWIFT_MIRROR_TOKEN }}
        run: |
          set -euo pipefail

          PREFIX="${{ matrix.prefix }}"
          MIRROR="${{ matrix.mirror }}"
          VERSION="${{ inputs.version }}"

          # Split subdirectory into its own branch
          SPLIT_SHA=$(git subtree split --prefix="$PREFIX" -b "split-$PREFIX")
          echo "Split SHA: $SPLIT_SHA"

          # Add mirror remote if not already configured
          if ! git remote get-url mirror &>/dev/null; then
            git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR}.git"
          fi

          # Push to mirror repo
          git push mirror "split-$PREFIX:refs/heads/main" --force

          # Fail if tag already exists on the mirror (prevents silent overwrites)
          if git ls-remote --tags mirror | grep -q "refs/tags/${VERSION}$"; then
            echo "::error::Tag $VERSION already exists on $MIRROR. Bump the version or delete the remote tag first."
            exit 1
          fi

          # Create and push version tag on the mirror
          git tag "$VERSION" "$SPLIT_SHA"
          git push mirror "$VERSION"

          echo "✓ Published $PREFIX $VERSION → $MIRROR"

  # Also tag the monorepo for traceability
  tag-monorepo:
    name: Tag Monorepo
    runs-on: ubuntu-latest
    needs: [publish-to-mirrors]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create monorepo tags
        run: |
          VERSION="${{ inputs.version }}"
          for PKG in hypen-renderer-swift hypen-server-swift; do
            TAG="${PKG}/${VERSION}"
            git tag --force "$TAG"
            git push --force origin "$TAG"
            echo "✓ Tagged $TAG"
          done
