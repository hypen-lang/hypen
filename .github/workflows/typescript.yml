name: TypeScript

on:
  push:
    branches: [main, develop]
    paths:
      - "hypen-web/**"
      - "hypen-cli/**"
      - "hypen-lsp/**"
      - "engine-compatibility-tests/runners/typescript/**"
      # Device Capability Protocol (RFC 001): the TS runners, the generated
      # validators (tests/device-generated.test.ts re-runs
      # scripts/generate-device-types.ts and diffs generated.ts) consume the
      # shared schemas and fixtures.
      - "engine-compatibility-tests/schema/device/**"
      - "engine-compatibility-tests/fixtures/device/**"
      # The server SDK runs the Rust device broker from the engine WASM
      # built below: engine changes must run the TS suites against it.
      - "hypen-engine-rs/src/**"
      - "hypen-engine-rs/Cargo.toml"
      - "hypen-engine-rs/copy-wasm-artifacts.sh"
      - "Cargo.lock"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "hypen-web/**"
      - "hypen-cli/**"
      - "hypen-lsp/**"
      - "engine-compatibility-tests/runners/typescript/**"
      # Device Capability Protocol (RFC 001): the TS runners, the generated
      # validators (tests/device-generated.test.ts re-runs
      # scripts/generate-device-types.ts and diffs generated.ts) consume the
      # shared schemas and fixtures.
      - "engine-compatibility-tests/schema/device/**"
      - "engine-compatibility-tests/fixtures/device/**"
      # The server SDK runs the Rust device broker from the engine WASM
      # built below: engine changes must run the TS suites against it.
      - "hypen-engine-rs/src/**"
      - "hypen-engine-rs/Cargo.toml"
      - "hypen-engine-rs/copy-wasm-artifacts.sh"
      - "Cargo.lock"
      - ".github/workflows/typescript.yml"

jobs:
  # ── Build WASM once, share via artifact ──────────────────────────
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            parser
            tailwind-parse
            hypen-engine-rs

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # `device-broker`: @hypen-space/server drives the Rust device broker
      # (RFC 001) through this build's `WasmDeviceBroker`; Cloudflare
      # (`@hypen-space/cf`) through the web-target build. The browser bundle
      # is built without the broker (build-wasm.sh).
      - name: Build WASM (nodejs)
        run: wasm-pack build --target nodejs --out-dir pkg/nodejs --features js,device-broker
        working-directory: hypen-engine-rs

      - name: Build WASM (web, Cloudflare)
        run: wasm-pack build --target web --out-dir pkg/web --features js,device-broker
        working-directory: hypen-engine-rs

      - name: Build WASM (browser, no device broker)
        run: wasm-pack build --target web --out-dir pkg/browser --features js
        working-directory: hypen-engine-rs

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-js
          path: |
            hypen-engine-rs/pkg/nodejs/
            hypen-engine-rs/pkg/web/
            hypen-engine-rs/pkg/browser/
          retention-days: 1

  web-sdk:
    name: Web SDK Tests
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: wasm-js
          path: hypen-engine-rs/pkg

      # The freshly built engine goes exactly where each package loads it
      # (the same script build-wasm.sh runs): wasm-node for the server,
      # the Cloudflare glue fixture paired with its wasm by SHA-256, and
      # the browser bundle. Copies, not symlinks (Bun __dirname resolution).
      - name: Setup WASM
        run: bash hypen-engine-rs/copy-wasm-artifacts.sh

      - name: Install dependencies
        run: bun install
        working-directory: hypen-web

      # Typecheck every @hypen-space/* package, including @hypen-space/cf.
      # cf previously had no typecheck script and was absent from the
      # aggregate, so it silently drifted behind core across releases; the
      # `typecheck` script now covers core/web/server/web-engine/cf.
      - name: Typecheck (all packages)
        run: bun run typecheck
        working-directory: hypen-web

      - name: Run tests
        run: bun test
        working-directory: hypen-web

  cli:
    name: CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: hypen-cli

      # The studio-ui LSP integration tests spawn hypen-lsp/src/server.ts,
      # which needs hypen-lsp's own dependencies installed.
      - name: Install LSP dependencies
        run: bun install
        working-directory: hypen-lsp

      - name: Run tests
        run: bun test
        working-directory: hypen-cli

  lsp:
    name: LSP Build
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v4

      # hypen-lsp/wasm-engine is a symlink to ../hypen-engine-rs/pkg/nodejs;
      # without the engine WASM artifact, `tsc -b` fails resolving
      # src/a11y.ts's import of ../wasm-engine/hypen_engine.js.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-js
          path: hypen-engine-rs/pkg

      # hypen-lsp is a bun package (bun.lock, no package-lock.json), so use
      # bun for installs; `npm ci` fails without an npm lockfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build parser WASM
        run: wasm-pack build --target nodejs --out-dir pkg/nodejs --features wasm
        working-directory: parser

      - name: Setup WASM symlink
        run: |
          cd hypen-lsp
          rm -rf wasm
          ln -sf ../parser/pkg/nodejs wasm

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: hypen-lsp

      - name: Compile
        run: bunx tsc -b
        working-directory: hypen-lsp

      - name: Lint
        run: bunx eslint ./src --ext .ts
        working-directory: hypen-lsp
        continue-on-error: true

  compatibility:
    name: Compatibility Tests
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: wasm-js
          path: hypen-engine-rs/pkg

      - name: Setup WASM
        run: bash hypen-engine-rs/copy-wasm-artifacts.sh

      - name: Install dependencies
        run: bun install
        working-directory: engine-compatibility-tests/runners/typescript

      - name: Run compatibility tests
        run: bun test
        working-directory: engine-compatibility-tests/runners/typescript
