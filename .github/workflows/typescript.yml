name: TypeScript

on:
  push:
    branches: [main, develop]
    paths:
      - "hypen-web/**"
      - "hypen-cli/**"
      - "hypen-lsp/**"
      - "engine-compatibility-tests/runners/typescript/**"
      # Device Capability Protocol (RFC 001): the TS runners, the generated
      # validators (tests/device-generated.test.ts re-runs
      # scripts/generate-device-types.ts and diffs generated.ts) consume the
      # shared schemas and fixtures.
      - "engine-compatibility-tests/schema/device/**"
      - "engine-compatibility-tests/fixtures/device/**"
      # The server SDK runs the Rust device broker from the engine WASM
      # built below: engine changes must run the TS suites against it.
      - "hypen-engine-rs/src/**"
      - "hypen-engine-rs/Cargo.toml"
      - "hypen-engine-rs/copy-wasm-artifacts.sh"
      - "Cargo.lock"
      - ".github/workflows/typescript.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "hypen-web/**"
      - "hypen-cli/**"
      - "hypen-lsp/**"
      - "engine-compatibility-tests/runners/typescript/**"
      # Device Capability Protocol (RFC 001): the TS runners, the generated
      # validators (tests/device-generated.test.ts re-runs
      # scripts/generate-device-types.ts and diffs generated.ts) consume the
      # shared schemas and fixtures.
      - "engine-compatibility-tests/schema/device/**"
      - "engine-compatibility-tests/fixtures/device/**"
      # The server SDK runs the Rust device broker from the engine WASM
      # built below: engine changes must run the TS suites against it.
      - "hypen-engine-rs/src/**"
      - "hypen-engine-rs/Cargo.toml"
      - "hypen-engine-rs/copy-wasm-artifacts.sh"
      - "Cargo.lock"
      - ".github/workflows/typescript.yml"

jobs:
  # ── Build WASM once, share via artifact ──────────────────────────
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            parser
            tailwind-parse
            hypen-engine-rs

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # `device-broker`: @hypen-space/server drives the Rust device broker
      # (RFC 001) through this build's `WasmDeviceBroker`; Cloudflare
      # (`@hypen-space/cf`) through the web-target build. The browser bundle
      # is built without the broker (build-wasm.sh).
      - name: Build WASM (nodejs)
        run: wasm-pack build --target nodejs --out-dir pkg/nodejs --features js,device-broker
        working-directory: hypen-engine-rs

      - name: Build WASM (web, Cloudflare)
        run: wasm-pack build --target web --out-dir pkg/web --features js,device-broker
        working-directory: hypen-engine-rs

      - name: Build WASM (browser, no device broker)
        run: wasm-pack build --target web --out-dir pkg/browser --features js
        working-directory: hypen-engine-rs

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-js
          path: |
            hypen-engine-rs/pkg/nodejs/
            hypen-engine-rs/pkg/web/
            hypen-engine-rs/pkg/browser/
          retention-days: 1

  web-sdk:
    name: Web SDK Tests
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: wasm-js
          path: hypen-engine-rs/pkg

      # The freshly built engine goes exactly where each package loads it
      # (the same script build-wasm.sh runs): wasm-node for the server,
      # the Cloudflare glue fixture paired with its wasm by SHA-256, and
      # the browser bundle. Copies, not symlinks (Bun __dirname resolution).
      - name: Setup WASM
        run: bash hypen-engine-rs/copy-wasm-artifacts.sh

      - name: Install dependencies
        run: bun install
        working-directory: hypen-web

      # Typecheck every @hypen-space/* package, including @hypen-space/cf.
      # cf previously had no typecheck script and was absent from the
      # aggregate, so it silently drifted behind core across releases; the
      # `typecheck` script now covers core/web/server/web-engine/cf/agent/
      # device-web/device-fake/module-host.
      - name: Typecheck (all packages)
        run: bun run typecheck
        working-directory: hypen-web

      # Also runs packages/module-host/tests: bun discovers every package's
      # tests from here, and hypen-web/bunfig.toml preloads module-host's
      # tests/_preload.ts (preview2-shim aliased to its browser build).
      - name: Run tests
        run: bun test
        working-directory: hypen-web

  cli:
    name: CLI Tests
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: wasm-js
          path: hypen-engine-rs/pkg

      - name: Setup WASM
        run: bash hypen-engine-rs/copy-wasm-artifacts.sh

      # Test the CLI against this checkout's @hypen-space/* packages, not the
      # npm release: after a version bump the new version is not published
      # until this change merges, and the CLI should be tested with the code
      # it ships with. dev-node imports the server's built dist/.
      - name: Build hypen-web packages
        run: bun install && bun run build
        working-directory: hypen-web

      - name: Link CLI to the checkout's packages
        run: bun scripts/ci-link-local-packages.ts
        working-directory: hypen-cli

      - name: Install dependencies
        run: bun install
        working-directory: hypen-cli

      # The studio-ui LSP integration tests spawn hypen-lsp/src/server.ts,
      # which needs hypen-lsp's own dependencies installed.
      - name: Install LSP dependencies
        run: bun install
        working-directory: hypen-lsp

      - name: Run tests
        run: bun test
        working-directory: hypen-cli

  # `hypen build --target wasm` end to end (tests/build-wasm.test.ts with
  # HYPEN_WASM_E2E=1): the TS pipeline (esbuild bundle -> jco componentize,
  # jco from the CLI's own dependencies) and the Rust pipeline (cargo,
  # wasm32-wasip2). The Go pipeline needs tinygo + wit-bindgen-go, which are
  # not installed here, so those tests skip with a warning; the TinyGo file
  # set is type-checked in cross-platform.yml instead.
  cli-wasm-build:
    name: CLI wasm build (e2e)
    runs-on: ubuntu-latest
    needs: [build-wasm]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_RELEASE_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - uses: actions/download-artifact@v4
        with:
          name: wasm-js
          path: hypen-engine-rs/pkg

      - name: Setup WASM
        run: bash hypen-engine-rs/copy-wasm-artifacts.sh

      # The TS e2e bundles the module against @hypen-space/core/server from
      # this checkout, so build them (same as the `cli` job).
      - name: Build hypen-web packages
        run: bun install && bun run build
        working-directory: hypen-web

      - name: Link CLI to the checkout's packages
        run: bun scripts/ci-link-local-packages.ts
        working-directory: hypen-cli

      - name: Install dependencies
        run: bun install
        working-directory: hypen-cli

      # The TS e2e is `test.if(toolchain present)`, and the Rust e2e returns
      # early with a "[skip]" warning when cargo or wasm32-wasip2 is missing:
      # both would pass silently. Fail if either was skipped here; only the
      # Go pipeline (no tinygo on this runner) may skip.
      - name: Run wasm build e2e
        run: |
          set -o pipefail
          HYPEN_WASM_E2E=1 bun test tests/build-wasm.test.ts 2>&1 | tee build-wasm-e2e.log
          if grep -Eq '^ *[1-9][0-9]* skip' build-wasm-e2e.log; then
            echo "::error::build-wasm e2e skipped tests (jco/esbuild or core/server not resolvable)"
            exit 1
          fi
          if grep -Eq '\[skip\] (Rust toolchain|wasm32-wasip2)' build-wasm-e2e.log; then
            echo "::error::Rust wasm build e2e skipped (cargo or wasm32-wasip2 missing)"
            exit 1
          fi
        shell: bash
        working-directory: hypen-cli

  lsp:
    name: LSP Build
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v4

      # hypen-lsp/wasm-engine is a symlink to ../hypen-engine-rs/pkg/nodejs;
      # without the engine WASM artifact, `tsc -b` fails resolving
      # src/a11y.ts's import of ../wasm-engine/hypen_engine.js.
      - uses: actions/download-artifact@v4
        with:
          name: wasm-js
          path: hypen-engine-rs/pkg

      # hypen-lsp is a bun package (bun.lock, no package-lock.json), so use
      # bun for installs; `npm ci` fails without an npm lockfile.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build parser WASM
        run: wasm-pack build --target nodejs --out-dir pkg/nodejs --features wasm
        working-directory: parser

      - name: Setup WASM symlink
        run: |
          cd hypen-lsp
          rm -rf wasm
          ln -sf ../parser/pkg/nodejs wasm

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: hypen-lsp

      - name: Compile
        run: bunx tsc -b
        working-directory: hypen-lsp

      - name: Lint
        run: bunx eslint ./src --ext .ts
        working-directory: hypen-lsp
        continue-on-error: true

  compatibility:
    name: Compatibility Tests
    runs-on: ubuntu-latest
    needs: [build-wasm]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: wasm-js
          path: hypen-engine-rs/pkg

      - name: Setup WASM
        run: bash hypen-engine-rs/copy-wasm-artifacts.sh

      - name: Install dependencies
        run: bun install
        working-directory: engine-compatibility-tests/runners/typescript

      - name: Run compatibility tests
        run: bun test
        working-directory: engine-compatibility-tests/runners/typescript
