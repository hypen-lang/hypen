name: Publish Kotlin SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true
        type: string
      dry-run:
        description: "Dry run — build & test only, skip publishing"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: true
    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      SIGNING_KEY:
        required: true
      SIGNING_PASSWORD:
        required: true

jobs:
  build-and-test:
    name: Build UniFFI + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            parser
            tailwind-parse
            hypen-engine-rs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Build native library with UniFFI bindings
      - name: Build engine (UniFFI)
        run: cargo build --release --features uniffi
        working-directory: hypen-engine-rs

      - name: Run Kotlin tests
        run: ./gradlew test
        working-directory: hypen-kotlin
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hypen-engine-rs/target/release

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: ${{ !inputs.dry-run }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            parser
            tailwind-parse
            hypen-engine-rs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build engine (UniFFI)
        run: cargo build --release --features uniffi
        working-directory: hypen-engine-rs

      - name: Set version
        run: sed -i 's/version = ".*"/version = "${{ inputs.version }}"/' build.gradle.kts
        working-directory: hypen-kotlin

      - name: Publish
        run: ./gradlew publishAllPublicationsToMavenCentralRepository
        working-directory: hypen-kotlin
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/hypen-engine-rs/target/release
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
