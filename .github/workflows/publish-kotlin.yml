name: Publish Kotlin SDK

# The published jar bundles the native engine (libhypen_engine, built with
# the `uniffi` feature) for every supported platform as JNA classpath
# resources (`<os-arch>/<lib>`), so consumers of space.hypen:hypen-kotlin
# need no Rust toolchain, jna.library.path or HYPEN_NATIVE_LIB_DIR.
#
#   natives  (matrix)  cargo build per platform -> artifact natives-<prefix>
#   package            download all five into hypen-kotlin/build/natives,
#                      assert they are present, test against the bundled
#                      linux-x86-64 library, check the jar listing, and
#                      publish (unless dry-run)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true
        type: string
      dry-run:
        description: "Dry run — build & test only, skip publishing"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: true
    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      SIGNING_KEY:
        required: true
      SIGNING_PASSWORD:
        required: true

jobs:
  natives:
    name: Native engine (${{ matrix.prefix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux libraries are built on 22.04 so they need at most the
          # glibc that ships there (2.35); a 24.04 build could pick up
          # newer symbol versions and refuse to load on older distros.
          - os: ubuntu-22.04
            prefix: linux-x86-64
            lib: libhypen_engine.so
          - os: ubuntu-22.04-arm
            prefix: linux-aarch64
            lib: libhypen_engine.so
          - os: macos-14
            prefix: darwin-aarch64
            lib: libhypen_engine.dylib
          # Intel macOS is cross-compiled on the Apple Silicon runner (the
          # Xcode toolchain targets both); GitHub has retired the macos-13
          # Intel image.
          - os: macos-14
            prefix: darwin-x86-64
            lib: libhypen_engine.dylib
            target: x86_64-apple-darwin
          - os: windows-latest
            prefix: win32-x86-64
            lib: hypen_engine.dll
    defaults:
      run:
        shell: bash
    env:
      # Oldest macOS the dylibs load on.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: kotlin-natives-${{ matrix.prefix }}

      - name: Build engine (UniFFI)
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Link the MSVC runtime statically so the DLL does not depend
            # on vcruntime140.dll being installed.
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          TARGET_ARGS=""
          OUT_DIR="target/release"
          if [ -n "${{ matrix.target }}" ]; then
            TARGET_ARGS="--target ${{ matrix.target }}"
            OUT_DIR="target/${{ matrix.target }}/release"
          fi
          cargo build --release -p hypen-engine --features uniffi $TARGET_ARGS
          mkdir -p "natives/${{ matrix.prefix }}"
          cp "$OUT_DIR/${{ matrix.lib }}" "natives/${{ matrix.prefix }}/${{ matrix.lib }}"
          ls -l "natives/${{ matrix.prefix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.prefix }}
          path: natives/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Test + Publish to Maven Central
    runs-on: ubuntu-latest
    needs: [natives]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true
          path: hypen-kotlin/build/natives

      - name: Assert all five native libraries are present
        working-directory: hypen-kotlin/build/natives
        run: |
          set -euo pipefail
          missing=0
          for lib in \
            linux-x86-64/libhypen_engine.so \
            linux-aarch64/libhypen_engine.so \
            darwin-aarch64/libhypen_engine.dylib \
            darwin-x86-64/libhypen_engine.dylib \
            win32-x86-64/hypen_engine.dll; do
            if [ -s "$lib" ]; then echo "ok      $lib"; else echo "MISSING $lib"; missing=1; fi
          done
          exit $missing

      - name: Set version
        run: sed -i 's/version = ".*"/version = "${{ inputs.version }}"/' build.gradle.kts
        working-directory: hypen-kotlin

      # No cargo build here: target/release has no engine library, so the
      # tests load the bundled linux-x86-64 copy from the classpath — the
      # exact binary that gets published.
      - name: Run Kotlin tests
        run: ./gradlew test -Phypen.requireNatives=true
        working-directory: hypen-kotlin

      - name: Check the jar bundles every native library
        working-directory: hypen-kotlin
        run: |
          set -euo pipefail
          ./gradlew jar -Phypen.requireNatives=true
          jar="build/libs/hypen-kotlin-${{ inputs.version }}.jar"
          unzip -l "$jar" | grep -E 'hypen_engine\.(so|dylib|dll)$'
          test "$(unzip -l "$jar" | grep -cE 'hypen_engine\.(so|dylib|dll)$')" -eq 5

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: ./gradlew publishAllPublicationsToMavenCentralRepository -Phypen.requireNatives=true
        working-directory: hypen-kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
