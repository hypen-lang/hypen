name: Integration

# Runs when Rust core changes land on main, verifying all downstream
# SDKs still build and pass tests.  Also runnable manually.
on:
  workflow_run:
    workflows: [Rust]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Build all WASM flavors once ──────────────────────────────────
  build-wasm-js:
    name: Build WASM (JS)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            parser
            tailwind-parse
            hypen-engine-rs

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM (nodejs)
        run: wasm-pack build --target nodejs --out-dir pkg/nodejs --features js,device-broker
        working-directory: hypen-engine-rs

      # Cloudflare (@hypen-space/cf) runs the device broker from the
      # web-target build; the browser bundle carries no broker.
      - name: Build WASM (web, Cloudflare)
        run: wasm-pack build --target web --out-dir pkg/web --features js,device-broker
        working-directory: hypen-engine-rs

      - name: Build WASM (browser, no device broker)
        run: wasm-pack build --target web --out-dir pkg/browser --features js
        working-directory: hypen-engine-rs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-js
          path: |
            hypen-engine-rs/pkg/nodejs/
            hypen-engine-rs/pkg/web/
            hypen-engine-rs/pkg/browser/
          retention-days: 1

  build-wasm-wasi:
    name: Build WASM (WASI)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            parser
            tailwind-parse
            hypen-engine-rs

      - name: Build WASI
        run: |
          cargo build --target wasm32-wasip1 --release --features wasi
          mkdir -p pkg/wasi
          cp ../target/wasm32-wasip1/release/hypen_engine.wasm pkg/wasi/
        working-directory: hypen-engine-rs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-wasi
          path: hypen-engine-rs/pkg/wasi/
          retention-days: 1

  build-parser-wasm:
    name: Build Parser WASM
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build parser WASM (nodejs)
        run: wasm-pack build --target nodejs --out-dir pkg/nodejs --features wasm
        working-directory: parser

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: parser-wasm-nodejs
          path: parser/pkg/nodejs/
          retention-days: 1

  build-uniffi:
    name: Build UniFFI (Linux)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            parser
            tailwind-parse
            hypen-engine-rs

      - name: Build engine with UniFFI
        run: cargo build --release --features uniffi
        working-directory: hypen-engine-rs

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: uniffi-linux
          path: target/release/libhypen_engine.so
          retention-days: 1

  # ── Downstream: TypeScript ───────────────────────────────────────
  test-typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    needs: [build-wasm-js]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: wasm-js
          path: hypen-engine-rs/pkg

      # The built engine goes where each package loads it (the same script
      # build-wasm.sh runs): the server's wasm-node (device broker), the
      # Cloudflare glue fixture paired with its wasm, the browser bundle.
      - name: Setup WASM
        run: bash hypen-engine-rs/copy-wasm-artifacts.sh

      - name: Install & test
        run: bun install && bun test
        working-directory: hypen-web

  # ── Downstream: Go ───────────────────────────────────────────────
  test-go:
    name: Go SDK
    runs-on: ubuntu-latest
    needs: [build-wasm-wasi]
    steps:
      - uses: actions/checkout@v4

      # The toolchain follows go.mod's `go` directive (>= 1.22; wazero
      # releases raise it), so CI never builds with a Go older than the
      # module requires.
      - uses: actions/setup-go@v5
        with:
          go-version-file: hypen-golang/go.mod
          cache-dependency-path: hypen-golang/go.sum

      - uses: actions/download-artifact@v4
        with:
          name: wasm-wasi
          path: hypen-engine-rs/pkg/wasi

      # The Go SDK embeds hypen-golang/hypen_engine.wasm (go:embed): test
      # the module built from this commit, not the committed copy.
      - name: Install the WASI engine module
        run: bash hypen-engine-rs/copy-wasm-artifacts.sh

      # The cross-language device e2e runs the real TypeScript web client
      # (bun) against the Go server; HYPEN_E2E_REQUIRE=1 makes a missing
      # bun / hypen-web install fail the job instead of skipping the test.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install hypen-web dependencies (TS device client for the e2e)
        run: bun install
        working-directory: hypen-web

      - name: Run tests
        run: go test -race -v ./...
        working-directory: hypen-golang
        env:
          HYPEN_E2E_REQUIRE: "1"

      - name: Cross-language device e2e (Go server vs TypeScript client)
        run: go test ./remote -run 'TestDeviceE2ETypeScriptClient' -count=1 -v
        working-directory: hypen-golang
        env:
          HYPEN_E2E_REQUIRE: "1"

  # ── Downstream: Kotlin ───────────────────────────────────────────
  test-kotlin:
    name: Kotlin SDK
    runs-on: ubuntu-latest
    needs: [build-uniffi]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/download-artifact@v4
        with:
          name: uniffi-linux
          path: target/release

      - name: Run tests
        run: ./gradlew test
        working-directory: hypen-kotlin
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release

      # Cross-language device e2e (DeviceWebSocketE2ETest, tag `e2e`, not
      # part of `test`): the real TypeScript web client (bun) against
      # HypenServer over a real WebSocket. `deviceE2eTest` fails — never
      # skips — when bun or hypen-web's node_modules are missing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install hypen-web dependencies (TS device client for the e2e)
        run: bun install
        working-directory: hypen-web

      - name: Cross-language device e2e (Kotlin server vs TypeScript client)
        run: ./gradlew deviceE2eTest
        working-directory: hypen-kotlin
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release

  # ── Downstream: Swift Renderer ───────────────────────────────────
  test-swift:
    name: Swift Renderer
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build
        working-directory: hypen-renderer-swift

      - name: Test
        run: swift test
        working-directory: hypen-renderer-swift

  # ── Downstream: Swift Server SDK ───────────────────────────────
  test-swift-server:
    name: Swift Server SDK
    runs-on: macos-latest
    needs: [build-uniffi]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build engine with UniFFI
        run: cargo build --release --features uniffi
        working-directory: hypen-engine-rs

      - name: Build
        run: swift build
        working-directory: hypen-server-swift
        env:
          LIBRARY_PATH: ${{ github.workspace }}/target/release

      - name: Test
        run: swift test
        working-directory: hypen-server-swift
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          LIBRARY_PATH: ${{ github.workspace }}/target/release

      # Cross-language device e2e (Tests/DeviceE2E): the real TypeScript web
      # client (bun) against HypenDeviceE2EServer over a real WebSocket.
      # run.sh fails — never skips — when bun or hypen-web's node_modules
      # are missing.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install hypen-web dependencies (TS device client for the e2e)
        run: bun install
        working-directory: hypen-web

      - name: Cross-language device e2e (Swift server vs TypeScript client)
        run: Tests/DeviceE2E/run.sh
        working-directory: hypen-server-swift
        env:
          HYPEN_ENGINE_LIB_DIR: ${{ github.workspace }}/target/release

  # ── Downstream: Android ──────────────────────────────────────────
  test-android:
    name: Android Renderer
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build renderer
        run: ./gradlew :renderer:build
        working-directory: hypen-renderer-android

      - name: Unit tests
        run: ./gradlew :renderer:test
        working-directory: hypen-renderer-android

  # ── Downstream: LSP ──────────────────────────────────────────────
  test-lsp:
    name: LSP Extension
    runs-on: ubuntu-latest
    needs: [build-parser-wasm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        with:
          name: parser-wasm-nodejs
          path: hypen-lsp/wasm

      - name: Install & compile
        run: npm ci && npx tsc -b
        working-directory: hypen-lsp

  # ── Downstream: Compatibility Tests ──────────────────────────────
  test-compatibility:
    name: Compatibility Tests
    runs-on: ubuntu-latest
    needs: [build-wasm-js]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: wasm-js
          path: hypen-engine-rs/pkg

      - name: Setup WASM
        run: bash hypen-engine-rs/copy-wasm-artifacts.sh

      - name: Install & test
        run: bun install && bun test
        working-directory: engine-compatibility-tests/runners/typescript
