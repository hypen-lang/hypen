name: Publish LSP Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.3.0)"
        required: true
        type: string
      dry-run:
        description: "Dry run — build only, skip publishing"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: true
    secrets:
      VSCE_PAT:
        required: true

jobs:
  build-and-test:
    name: Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The LSP imports both parser and engine WASM through checked-in symlinks.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parser

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build parser WASM
        run: wasm-pack build --target nodejs --out-dir pkg/nodejs --features wasm
        working-directory: parser

      - name: Build engine WASM
        run: wasm-pack build --target nodejs --out-dir pkg/nodejs --features js,device-broker
        working-directory: hypen-engine-rs

      # VSCE does not follow the checked-in wasm and wasm-engine symlinks.
      - name: Copy WASM into extension package
        run: |
          rm hypen-lsp/wasm hypen-lsp/wasm-engine
          cp -R parser/pkg/nodejs hypen-lsp/wasm
          cp -R hypen-engine-rs/pkg/nodejs hypen-lsp/wasm-engine

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: hypen-lsp

      - name: Compile
        run: bunx tsc -b
        working-directory: hypen-lsp

      - name: Lint
        run: bunx eslint ./src --ext .ts
        working-directory: hypen-lsp

      # VSIX uses .vscodeignore; npm publication uses package.json files.
      - name: Prepare marketplace manifest
        run: |
          npm pkg set name=hypen-lsp
          npm pkg delete files
          cp ../LICENSE ./LICENSE
        working-directory: hypen-lsp

      - name: Package VSIX
        run: bunx vsce package
        working-directory: hypen-lsp

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: hypen-lsp-vsix
          path: hypen-lsp/*.vsix

  publish:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: ${{ !inputs.dry-run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: hypen-lsp-vsix
          path: hypen-lsp

      - name: Install publishing tool
        run: bun install --frozen-lockfile
        working-directory: hypen-lsp

      - name: Set marketplace extension name
        run: npm pkg set name=hypen-lsp
        working-directory: hypen-lsp

      - name: Publish
        run: bunx vsce publish --packagePath *.vsix
        working-directory: hypen-lsp
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
