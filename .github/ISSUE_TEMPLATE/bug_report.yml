name: Bug report
description: Report a reproducible bug in the Hypen language, engine, SDKs, CLI, docs, or renderers.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        Please include a minimal reproduction when possible. For monorepo issues, it helps a lot if you call out which package or platform is affected.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the monorepo is affected?
      options:
        - parser
        - hypen-engine-rs
        - hypen-sdk-rs
        - hypen-web
        - hypen-cli
        - hypen-lsp
        - hypen-kotlin
        - hypen-renderer-android
        - hypen-renderer-swift
        - hypen-server-swift
        - hypen-golang
        - hypen-docs
        - examples
        - component-gallery-server
        - other / unsure
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where are you seeing the problem?
      options:
        - Web
        - Bun / Node.js
        - Rust
        - Go
        - Kotlin / JVM
        - Android
        - Swift / Apple platforms
        - VS Code / LSP
        - Docs
        - Cross-platform
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A short summary of the bug.
      placeholder: Describe the behavior you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small Hypen file, code sample, repo link, or exact commands if you can.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Trigger ...

        ```hypen
        Column {
          Text("Hello")
        }
        ```
      render: markdown
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, errors, or screenshots
      description: Paste stack traces, compiler output, rendered patches, or screenshots here.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Which Hypen version, package version, or commit are you using?
      placeholder: e.g. 0.4.948 or commit abc123
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share any environment details that matter.
      placeholder: |
        OS:
        Bun / Node:
        Rust:
        Xcode / Android Studio:
        Browser / device:
      render: markdown
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I included a minimal reproduction or exact steps.
          required: true
