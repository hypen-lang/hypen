[package]
name = "hypen-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Rust server SDK for building Hypen applications"
keywords = ["hypen", "ui", "server", "sdk", "declarative"]
categories = ["gui", "web-programming"]
readme = "README.md"

[dependencies]
hypen-engine = { version = "0.4.980", path = "../hypen-engine-rs" }
hypen-parser = { version = "0.4.980", path = "../parser" }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { version = "2.0", features = ["serde"] }

[features]
default = []
async = ["tokio"]

[dependencies.tokio]
version = "1"
features = ["rt"]
optional = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
