[workspace]
resolver = "2"
members = [
    "parser",
    "hypen-engine-rs",
    "tailwind-parse",
    "hypen-sdk-rs",
    "hypen-renderer-desktop",
    "hypen-browser",
    "engine-compatibility-tests/runners/rust",
]
exclude = [
    # Vendored dependency (see third_party/rav1d/PATCHES.md), not a member.
    "third_party/rav1d",
    "examples/social/rust",
    "examples/food-ordering/rust",
]

[workspace.package]
version = "0.6.7"
edition = "2021"
license = "MIT"
repository = "https://github.com/hypen-lang/hypen"
authors = ["Hypen Contributors"]

# Shared dependency versions — crates reference these via { workspace = true }
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# rav1d (the desktop renderer's AVIF decoder) unoptimised takes seconds
# per wallpaper-sized image; dev builds decode with it optimised.
[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false
overflow-checks = false

# rav1d with `extern "C-unwind"` entry points, so a panic on a malformed
# AV1 bitstream unwinds to the desktop renderer's `catch_unwind` instead of
# aborting the process. See third_party/rav1d/PATCHES.md.
[patch.crates-io]
rav1d = { path = "third_party/rav1d" }

# No `panic = "abort"` in any profile: the AVIF decoder's panic isolation
# (hypen-renderer-desktop/src/paint/avif.rs) relies on unwinding.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
