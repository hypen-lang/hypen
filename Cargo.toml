[workspace]
resolver = "2"
members = [
    "parser",
    "hypen-engine-rs",
    "tailwind-parse",
    "hypen-sdk-rs",
    "hypen-renderer-desktop",
    "hypen-browser",
    "engine-compatibility-tests/runners/rust",
]
exclude = [
    "examples/social/rust",
    "examples/food-ordering/rust",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/hypen-lang/hypen"
authors = ["Hypen Contributors"]

# Shared dependency versions — crates reference these via { workspace = true }
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
