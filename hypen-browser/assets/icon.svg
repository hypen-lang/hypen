<!-- Master design for the Hypen Browser app icon. The shipped PNG/ICO/ICNS
     files are generated by generate-icons.py (which draws this same design);
     this SVG is the editable reference. Brand paths are verbatim from
     hypen-docs/public/favicon.svg (795x795 space), scaled to 1024 with the
     mark at 86% so the comet orbit has air. The generator fades the comet
     tail continuously along the orbit; here the fade is approximated with
     stepped-opacity 72° arc segments (head → front → back → gap). -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202027"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="512" x2="1024" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFECA7"/>
      <stop offset="1" stop-color="#FFA7E1"/>
    </linearGradient>
    <linearGradient id="glossGrad" x1="0" y1="0" x2="0" y2="522" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="230"/>
    </clipPath>
    <!-- Far / near halves of the orbit, split along its major axis
         (coordinates are in the rotated ring frame). -->
    <clipPath id="orbitBack" clipPathUnits="userSpaceOnUse">
      <rect x="-1024" y="-1024" width="3072" height="1536"/>
    </clipPath>
    <clipPath id="orbitFront" clipPathUnits="userSpaceOnUse">
      <rect x="-1024" y="512" width="3072" height="1536"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="102"/>
    </filter>
    <!-- Comet tail in the ring's local (untilted) frame: 80% of the
         ellipse from the head at (957 512), sweeping back-first (full
         across the back, fading around the front), in four 72° arcs of
         decreasing opacity. -->
    <g id="cometTail">
      <g opacity="0.35" filter="url(#soft)" stroke-width="45" stroke-linecap="round">
        <path d="M957 512A445 169 0 0 0 649.5 351.3" stroke="url(#ringGrad)" opacity="0.9"/>
        <path d="M649.5 351.3A445 169 0 0 0 152 412.6" stroke="url(#ringGrad)" opacity="0.6"/>
      </g>
      <g stroke-width="20" stroke-linecap="round">
        <path d="M957 512A445 169 0 0 0 649.5 351.3" stroke="url(#ringGrad)" opacity="0.92"/>
        <path d="M649.5 351.3A445 169 0 0 0 152 412.6" stroke="url(#ringGrad)" opacity="0.62"/>
        <path d="M152 412.6A445 169 0 0 0 152 611.4" stroke="url(#ringGrad)" opacity="0.36"/>
        <path d="M152 611.4A445 169 0 0 0 649.5 672.7" stroke="url(#ringGrad)" opacity="0.14"/>
      </g>
      <g stroke-width="7" stroke-linecap="round">
        <path d="M957 512A445 169 0 0 0 649.5 351.3" stroke="#FFFFFF" opacity="0.55"/>
        <path d="M649.5 351.3A445 169 0 0 0 152 412.6" stroke="#FFFFFF" opacity="0.35"/>
      </g>
    </g>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- warm glow rising off the wings -->
    <ellipse cx="348" cy="829" rx="287" ry="297" fill="#FFA7E1" opacity="0.30" filter="url(#glow)"/>
    <ellipse cx="717" cy="860" rx="287" ry="287" fill="#FFECA7" opacity="0.25" filter="url(#glow)"/>
    <!-- comet tail, far half (behind the mark) -->
    <g transform="rotate(-22 512 512)">
      <g clip-path="url(#orbitBack)">
        <use href="#cometTail"/>
      </g>
    </g>
    <!-- the brand mark at 86% -->
    <g transform="translate(71.68 71.68) scale(1.1077233)">
      <path transform="translate(0 11)" opacity="0.5" filter="url(#drop)" d="M424.4 253.4C464.4 253.4 496.6 265.4 521 289.4C545.8 313.4 558.2 349 558.2 396.2V581H464.6V410.6C464.6 385 459 366 447.8 353.6C436.6 340.8 420.4 334.4 399.2 334.4C375.6 334.4 356.8 341.8 342.8 356.6C328.8 371 321.8 392.6 321.8 421.4V581H228.2V135.8H321.8V291.8C334.2 279.4 349.2 270 366.8 263.6C384.4 256.8 403.6 253.4 424.4 253.4Z" fill="#000000"/>
      <path d="M414 688H201V609.439C207.956 609.108 238.894 608.644 307.004 609.439C375.114 610.235 414 664 414 688Z" fill="#FFA7E1"/>
      <path d="M370.5 609H595.5V687.561C588.544 687.892 557.606 688.356 489.496 687.561C421.386 686.765 451.5 617.5 370.5 609Z" fill="#FFECA7"/>
      <path d="M424.4 253.4C464.4 253.4 496.6 265.4 521 289.4C545.8 313.4 558.2 349 558.2 396.2V581H464.6V410.6C464.6 385 459 366 447.8 353.6C436.6 340.8 420.4 334.4 399.2 334.4C375.6 334.4 356.8 341.8 342.8 356.6C328.8 371 321.8 392.6 321.8 421.4V581H228.2V135.8H321.8V291.8C334.2 279.4 349.2 270 366.8 263.6C384.4 256.8 403.6 253.4 424.4 253.4Z" fill="#FFFFFF"/>
    </g>
    <!-- comet tail, near half (in front of the mark) + starburst head -->
    <g transform="rotate(-22 512 512)">
      <g clip-path="url(#orbitFront)">
        <use href="#cometTail"/>
      </g>
      <g transform="translate(957 512)">
        <circle r="59" fill="#FFF5D2" opacity="0.75" filter="url(#glow)"/>
        <path d="M0 -59L12 0L0 59L-12 0Z" fill="#FFFFFF"/>
        <path d="M-59 0L0 12L59 0L0 -12Z" fill="#FFFFFF"/>
      </g>
    </g>
    <!-- glossy top sheen -->
    <ellipse cx="512" cy="-143" rx="768" ry="655" fill="url(#glossGrad)"/>
  </g>
</svg>
