[package]
name = "hypen-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Hypen Browser — a native desktop browser for Hypen apps, built on the Hypen engine + desktop renderer"
readme = "README.md"

[dependencies]
hypen-engine = { version = "0.6.2", path = "../hypen-engine-rs" }
hypen-parser = { version = "0.6.2", path = "../parser" }
hypen-server = { version = "0.6.2", path = "../hypen-sdk-rs" }
hypen-renderer-desktop = { version = "0.6.2", path = "../hypen-renderer-desktop" }

serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { version = "2.0", features = ["serde"] }

# Cross-platform user data directory (recent-apps store).
dirs = "5"

# Logging surface for diagnostics.
log = "0.4"
env_logger = "0.11"

[build-dependencies]
# Embeds assets/icons/icon.ico into the exe on Windows targets only
# (see build.rs); compiles to a no-op everywhere else.
winresource = "0.1"

# Installer packaging (macOS .app/.dmg, Windows NSIS, Linux .deb/.AppImage)
# via cargo-packager — `cargo install cargo-packager --locked`, then
# `cargo packager --release -p hypen-browser` from the workspace root.
# CI builds all three platforms in .github/workflows/desktop-installers.yml.
# Icons are generated by assets/generate-icons.py.
[package.metadata.packager]
product-name = "Hypen Browser"
identifier = "space.hypen.browser"
category = "DeveloperTool"
license-file = "../LICENSE"
icons = [
    "assets/icons/icon.icns",   # macOS bundle icon
    "assets/icons/icon.ico",    # Windows installer / shortcuts
    "assets/icons/icon-*.png",  # Linux hicolor theme sizes
]

# Runtime libs the prebuilt Linux binary dlopens: X11/Wayland windowing,
# xkb keymaps, and the Vulkan loader for wgpu. All are stock on desktop
# distros; listed so a minimal install pulls them in.
[package.metadata.packager.deb]
depends = [
    "libx11-6",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
    "libwayland-client0",
    "libvulkan1",
]
