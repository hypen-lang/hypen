[package]
name = "hypen-browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Hypen Browser — a native desktop browser for Hypen apps, built on the Hypen engine + desktop renderer"

[dependencies]
hypen-engine = { version = "0.5.4", path = "../hypen-engine-rs" }
hypen-parser = { version = "0.5.4", path = "../parser" }
hypen-server = { version = "0.5.4", path = "../hypen-sdk-rs" }
hypen-renderer-desktop = { version = "0.5.4", path = "../hypen-renderer-desktop" }

serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { version = "2.0", features = ["serde"] }

# Cross-platform user data directory (recent-apps store).
dirs = "5"

# Logging surface for diagnostics.
log = "0.4"
env_logger = "0.11"
