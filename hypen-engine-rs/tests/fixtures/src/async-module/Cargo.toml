[package]
name = "hypen-async-module"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"
serde_json = "1"
# waki — idiomatic Rust HTTP over wasi:http. Inside a CM-async export the
# blocking p2 client parks this task on the poll; the host's event loop
# drives the request. This is the constrained-data-access shape (D1) until
# wasi:http@0.3 client streaming stabilizes.
waki = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Standalone; not part of the engine workspace.
[workspace]
