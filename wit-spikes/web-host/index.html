<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hypen WIT Spike - Browser Host</title>
<link rel="icon" href="data:,">  <!-- suppress favicon request -->

<style>
  body {
    font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #0b0c10;
    color: #d6d8db;
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 { color: #fff; font-size: 18px; margin: 0 0 6px; }
  .sub { color: #888; margin: 0 0 24px; }
  .controls { margin: 16px 0 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    background: #1e2733; color: #d6d8db;
    border: 1px solid #2d3a4d; border-radius: 4px;
    padding: 6px 12px; cursor: pointer;
    font: inherit;
  }
  button:hover { background: #243043; }
  #output {
    background: #050608; border: 1px solid #1a1f29;
    border-radius: 4px; padding: 12px;
    max-height: 60vh; overflow-y: auto;
    white-space: pre-wrap;
  }
  #output div { padding: 1px 0; }
  #output .section { color: #6aa9ff; margin-top: 8px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Hypen WIT v0.1 - Browser Host Spike</h1>
  <p class="sub">
    WASM Component module loaded via jco. <code>local</code> and <code>cloud</code> storage
    scopes backed by <code>localStorage</code>. State survives page reloads.
  </p>
  <div class="controls">
    <button id="increment">increment</button>
    <button id="sync">sync to cloud</button>
    <button id="dump">dump stores</button>
    <button id="reload">reload module (warm start)</button>
    <button id="reset">reset all storage</button>
  </div>
  <div id="output"></div>
  <script type="module" src="/dist/browser.js"></script>
</body>
</html>
