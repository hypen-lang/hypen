[package]
name = "hypen-fetcher-module"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"
serde_json = "1"
# waki — idiomatic Rust HTTP client over wasi:http/outgoing-handler.
# Demonstrates the "modules use language-native HTTP" promise.
waki = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Standalone; not part of the engine workspace.
[workspace]
