<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinebox — Hypen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 16% 8%, rgba(236, 72, 153, 0.32), transparent 28%),
        radial-gradient(circle at 88% 14%, rgba(244, 114, 182, 0.28), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(236, 72, 153, 0.16), transparent 36%),
        #050505;
      color: #F8FAFC;
    }
    #app {
      width: 100vw;
      max-width: none;
      margin: 0;
      height: 100vh;
      min-height: 0;
      background: #050505;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      overflow-x: hidden;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./client.ts"></script>
</body>
</html>
