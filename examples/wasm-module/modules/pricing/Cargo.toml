[package]
name = "pricing-module"
version = "0.1.0"
edition = "2021"
description = "Hypen example: a pricing module built to a WebAssembly Component"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true

# Standalone crate: not part of any surrounding Cargo workspace.
[workspace]
