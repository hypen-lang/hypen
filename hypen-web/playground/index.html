<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hypen Playground</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/editor/editor.main.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow: hidden;
      background: #1e1e1e;
      color: #d4d4d4;
    }

    .container {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #3e3e3e;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: #252526;
      border-bottom: 1px solid #3e3e3e;
    }

    .toolbar-title {
      font-size: 12px;
      font-weight: 600;
      color: #cccccc;
    }

    select {
      padding: 4px 8px;
      background: #3c3c3c;
      color: #cccccc;
      border: 1px solid #3e3e3e;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    select:hover {
      background: #454545;
    }

    .editors {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .editor-container {
      flex: 1;
      position: relative;
      border-bottom: 1px solid #3e3e3e;
    }

    .editor-container:last-child {
      border-bottom: none;
    }

    .editor-label {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 11px;
      font-weight: 600;
      color: #858585;
      z-index: 10;
      background: #1e1e1e;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #3e3e3e;
    }

    #hypen-editor, #logic-editor {
      width: 100%;
      height: 100%;
    }

    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .preview-toolbar {
      padding: 8px 12px;
      background: #f5f5f5;
      border-bottom: 1px solid #e0e0e0;
      font-size: 12px;
      font-weight: 600;
      color: #333;
    }

    #preview {
      flex: 1;
      overflow: auto;
      padding: 16px;
    }

    .error-banner {
      display: none;
      padding: 8px 12px;
      background: #f44336;
      color: white;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }

    .error-banner.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Left Panel: Editors -->
    <div class="left-panel">
      <div class="toolbar">
        <span class="toolbar-title">Hypen Playground</span>
        <select id="sample-selector">
          <option value="">Select a sample...</option>
          <option value="counter">Counter</option>
          <option value="profile">Profile Page</option>
          <option value="todo">Todo List</option>
          <option value="form">Form Example</option>
          <option value="charts">Charts</option>
        </select>
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; margin-left: auto;">
          <input type="checkbox" id="debug-toggle" style="cursor: pointer;">
          <span style="font-size: 12px; color: #cccccc;">Debug Mode (Re-render Heatmap)</span>
        </label>
        <button id="reset-debug" style="padding: 4px 8px; background: #3c3c3c; color: #cccccc; border: 1px solid #3e3e3e; border-radius: 4px; font-size: 12px; cursor: pointer;">Reset Tracking</button>
      </div>

      <div class="editors">
        <!-- Hypen DSL Editor -->
        <div class="editor-container">
          <div class="editor-label">HYPEN DSL</div>
          <div id="hypen-editor"></div>
        </div>

        <!-- TypeScript Logic Editor -->
        <div class="editor-container">
          <div class="editor-label">TYPESCRIPT MODULE</div>
          <div id="logic-editor"></div>
        </div>
      </div>
    </div>

    <!-- Right Panel: Live Preview -->
    <div class="right-panel">
      <div class="preview-toolbar">Live Preview</div>
      <div class="error-banner" id="error-banner"></div>
      <div id="preview"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <script src="https://unpkg.com/typescript@5/lib/typescript.js"></script>
  <script type="module" src="./playground.js"></script>
</body>
</html>
