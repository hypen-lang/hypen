<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hypen Shop - Declarative UI Demo</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: #0a0a0a;
        min-height: 100vh;
        overflow-x: hidden;
        color: #e0e0e0;
      }

      #app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Neon accents */
      :root {
        --neon-green: #00ff88;
        --neon-cyan: #00e5ff;
        --neon-pink: #ff006e;
        --neon-yellow: #ffff00;
        --bg-dark: #0a0a0a;
        --bg-card: #1a1a1a;
        --border-dark: #2a2a2a;
        --text-light: #e0e0e0;
        --text-muted: #888888;
      }

      /* Smooth transitions */
      button {
        transition: all 0.2s ease;
        font-weight: 600;
      }

      button:hover {
        opacity: 0.9;
      }

      button:active {
        opacity: 0.8;
      }

      /* Scrollbar styling */
      ::-webkit-scrollbar {
        width: 12px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-dark);
        border-left: 1px solid var(--border-dark);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-dark);
        border-radius: 6px;
        border: 2px solid var(--bg-dark);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--neon-green);
      }

      /* Loading animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      #app > * {
        animation: fadeIn 0.5s ease-out;
      }

      /* Debug controls */
      #debug-controls {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.95);
        padding: 16px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        z-index: 9999;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 250px;
      }

      #debug-controls h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: #333;
        border-bottom: 1px solid #ddd;
        padding-bottom: 8px;
      }

      #debug-controls label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        color: #555;
      }

      #debug-controls input[type="checkbox"] {
        cursor: pointer;
      }

      #debug-controls button {
        padding: 8px 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
      }

      #debug-controls button:hover {
        background: #5568d3;
      }

      #debug-stats {
        font-size: 12px;
        color: #666;
        padding: 8px;
        background: #f5f5f5;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Debug Controls -->
    <div id="debug-controls">
      <h3>🐛 Debug Mode</h3>
      <label>
        <input type="checkbox" id="heatmap-toggle">
        <span>Show Re-render Heatmap</span>
      </label>
      <button id="reset-tracking">Reset Tracking</button>
      <button id="show-stats">Show Stats</button>
      <div id="debug-stats"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
