<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypen Gallery</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html {
      width: 100%;
      height: 100%;
    }
    body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      overflow: hidden;
      position: relative;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #666;
      position: absolute;
      inset: 0;
      z-index: 10;
      background: #ffffff;
    }
    #loading.hidden {
      display: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e5e5;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #error {
      display: none;
      padding: 24px;
      color: #ef4444;
      text-align: center;
    }
    #error.show {
      display: block;
    }
    #app, #canvas-app {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #app.active, #canvas-app.active {
      display: block;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>Connecting...</div>
  </div>
  <div id="error"></div>
  <div id="app" class="active"></div>
  <canvas id="canvas-app"></canvas>

  <script type="module" src="./gallery-client.ts"></script>
</body>
</html>
